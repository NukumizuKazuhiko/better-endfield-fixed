# Signing credentials for the debug build type.
#
# This file is tracked on purpose. The keystore beside it is tracked too, so
# its password is public by construction -- a debug signing identity protects
# nothing. Tracking both is what lets a fresh clone and every CI runner produce
# a debug APK under the same stable identity, so one debug build installs over
# the previous one instead of demanding an uninstall.
#
# The release identity is deliberately not treated this way: it lives in the
# gitignored keystore/release.properties. See android/README.md, "Signing".
storeFile=keystore/bem-debug.keystore
storePassword=DETnYHXHROf3kO3WCl2iNfol2gEz3Ilm
keyAlias=bemdebug
